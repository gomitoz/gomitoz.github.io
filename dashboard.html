<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operación </title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Estilos para transiciones suaves entre temas */
        body { transition: background-color 0.3s, color 0.3s; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .glass-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
        }
        .dark .glass-card { 
            background: rgba(30, 41, 59, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">

<div class="container mx-auto px-4 py-6">
    
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-slate-200 dark:border-slate-700 pb-6">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i data-lucide="layout-dashboard"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Dashboard Operación <span class="text-blue-600">JAGG</span></h1>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:ring-2 ring-blue-500 transition-all">
                <i data-lucide="sun" id="sun-icon" class="hidden dark:block"></i>
                <i data-lucide="moon" id="moon-icon" class="block dark:hidden"></i>
            </button>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition-all">Exportar PDF</button>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="md:col-span-2 glass-card p-4 rounded-xl shadow-sm border-l-4 border-amber-500">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Paquetería Global</label>
            <select id="filtroPaqueteriaGlobal" onchange="aplicarFiltroGlobal()" class="w-full bg-transparent font-bold text-lg outline-none cursor-pointer">
                <option value="Todas">📦 Todas las Paqueterías</option>
                <option value="FedEx">🟣 FedEx Internacional</option>
                <option value="Afimex">🔴 Afimex Nacional</option>
            </select>
        </div>
        <div class="glass-card p-4 rounded-xl shadow-sm">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Desde</label>
            <input type="month" id="s1Inicio" onchange="renderSeccion1()" class="bg-transparent w-full outline-none font-semibold">
        </div>
        <div class="glass-card p-4 rounded-xl shadow-sm">
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Hasta</label>
            <input type="month" id="s1Fin" onchange="renderSeccion1()" class="bg-transparent w-full outline-none font-semibold">
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="glass-card p-6 rounded-2xl shadow-sm border-b-4 border-blue-500">
            <p class="text-sm text-slate-500 font-medium">Total Enviados</p>
            <h3 class="text-3xl font-bold" id="s1TotEnv">0</h3>
        </div>
        <div class="glass-card p-6 rounded-2xl shadow-sm border-b-4 border-emerald-500">
            <p class="text-sm text-slate-500 font-medium">Entregados</p>
            <h3 class="text-3xl font-bold text-emerald-500" id="s1TotEnt">0</h3>
        </div>
        <div class="glass-card p-6 rounded-2xl shadow-sm border-b-4 border-purple-500">
            <p class="text-sm text-slate-500 font-medium">Efectividad</p>
            <h3 class="text-3xl font-bold" id="s1Efic">0%</h3>
        </div>
        <div class="glass-card p-6 rounded-2xl shadow-sm border-b-4 border-orange-500">
            <p class="text-sm text-slate-500 font-medium">Top Destino</p>
            <h3 class="text-xl font-bold truncate" id="topDestino">...</h3>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        <div class="glass-card p-6 rounded-2xl shadow-sm">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="trending-up" class="text-blue-500"></i> Tendencia Mensual de Eficiencia
            </h3>
            <div class="chart-container"><canvas id="chartS1"></canvas></div>
        </div>
        <div class="glass-card p-6 rounded-2xl shadow-sm">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="bar-chart-3" class="text-purple-500"></i> Volumen por Día
            </h3>
            <div class="chart-container"><canvas id="chartS3"></canvas></div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 glass-card p-6 rounded-2xl shadow-sm">
            <h3 class="text-lg font-bold mb-4">Top 5 Productos</h3>
            <div class="space-y-4" id="listaTopProd">
                </div>
        </div>
        
        <div class="lg:col-span-2 glass-card p-6 rounded-2xl shadow-sm overflow-hidden">
            <h3 class="text-lg font-bold mb-4">Distribución por Estado</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-500 text-sm border-b border-slate-200 dark:border-slate-700">
                            <th class="pb-3 px-2">Estado</th>
                            <th class="pb-3 px-2">Producto Más Pedido</th>
                            <th class="pb-3 px-2 text-right">Volumen</th>
                        </tr>
                    </thead>
                    <tbody id="tablaS4Der" class="text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Inicializar Iconos
    lucide.createIcons();

    // Configuración Supabase
    const SUPABASE_URL = 'https://vtjosswxbkuklwfygvcn.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0am9zc3d4Ymt1a2x3ZnlndmNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODI4MTgsImV4cCI6MjA4OTg1ODgxOH0.K0gzcDf7figLjgQ3bWO2hgGS9K8yrb1_qxquGypUzOU'; 
    const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let paquetesGlobales = []; 
    let paquetesFiltrados = []; 
    let graficas = { s1: null, s3: null };

    // Toggle Dark Mode
    function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
        // Redibujar gráficas para ajustar colores si fuera necesario
        renderSeccion1();
        renderSeccion3();
    }

    // Descarga de datos sin login
    async function descargarDatos() {
        let { data, error } = await clienteSupabase.from('paquetes_enviados').select('*').limit(2000);
        if (data) {
            paquetesGlobales = data;
            aplicarFiltroGlobal();
        }
    }

    function aplicarFiltroGlobal() {
        const paq = document.getElementById('filtroPaqueteriaGlobal').value;
        let temp = paquetesGlobales;
        if (paq !== 'Todas') temp = temp.filter(p => p.paqueteria === paq);

        // Purificar Devoluciones (Tu Lógica Maestra)
        paquetesFiltrados = temp.filter(p => {
            const dest = (p.destinatario || '').toUpperCase();
            const prod = (p.producto || '').toUpperCase();
            // Si el destinatario es igual al producto en Afimex, es devolución
            if (p.paqueteria === 'Afimex' && dest === prod) return false;
            if (dest === 'DEVOLUCIÓN') return false;
            return true;
        });

        renderSeccion1();
        renderSeccion3();
        renderSeccion4();
    }

    function renderSeccion1() {
        const agrupado = {};
        paquetesFiltrados.forEach(p => {
            const periodo = (p.fecha_envio || '').substring(0, 7);
            if (!periodo) return;
            if (!agrupado[periodo]) agrupado[periodo] = { env: 0, ent: 0 };
            agrupado[periodo].env++;
            const st = (p.estatus_entrega || '').toLowerCase();
            if (st.includes('delivered') || st.includes('entregado') || st.includes('entregada') || st.includes('success')) {
                agrupado[periodo].ent++;
            }
        });

        const labels = Object.keys(agrupado).sort();
        const dEnv = labels.map(l => agrupado[l].env);
        const dEnt = labels.map(l => agrupado[l].ent);

        // Actualizar KPIs
        const totalEnv = dEnv.reduce((a,b) => a+b, 0);
        const totalEnt = dEnt.reduce((a,b) => a+b, 0);
        document.getElementById('s1TotEnv').innerText = totalEnv.toLocaleString();
        document.getElementById('s1TotEnt').innerText = totalEnt.toLocaleString();
        document.getElementById('s1Efic').innerText = totalEnv > 0 ? ((totalEnt/totalEnv)*100).toFixed(1)+'%' : '0%';

        if (graficas.s1) graficas.s1.destroy();
        const ctx = document.getElementById('chartS1').getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 400);
        grad.addColorStop(0, '#3b82f6');
        grad.addColorStop(1, '#60a5fa');

        graficas.s1 = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Enviados', data: dEnv, backgroundColor: grad, borderRadius: 8 },
                    { label: 'Entregados', data: dEnt, backgroundColor: '#10b981', borderRadius: 8 }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'bottom' } },
                scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
            }
        });
    }

    function renderSeccion3() {
        const agrupado = {};
        paquetesFiltrados.forEach(p => {
            const dia = (p.fecha_envio || '').substring(0, 10);
            if (dia) agrupado[dia] = (agrupado[dia] || 0) + 1;
        });

        const labels = Object.keys(agrupado).sort().slice(-15); // Últimos 15 días
        const dataArr = labels.map(l => agrupado[l]);

        if (graficas.s3) graficas.s3.destroy();
        graficas.s3 = new Chart(document.getElementById('chartS3'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ 
                    label: 'Pedidos', 
                    data: dataArr, 
                    borderColor: '#8b5cf6', 
                    backgroundColor: 'rgba(139, 92, 246, 0.1)', 
                    fill: true, 
                    tension: 0.4,
                    pointRadius: 4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function renderSeccion4() {
        // Top Productos
        const prodAg = {};
        const estAg = {};
        paquetesFiltrados.forEach(p => {
            const pr = p.producto || 'Otro';
            const es = p.estado_destino || 'MX';
            prodAg[pr] = (prodAg[pr] || 0) + 1;
            const llave = `${es}|${pr}`;
            estAg[llave] = (estAg[llave] || 0) + 1;
        });

        // UI Top Productos
        const top5 = Object.entries(prodAg).sort((a,b) => b[1]-a[1]).slice(0, 5);
        document.getElementById('listaTopProd').innerHTML = top5.map(([name, val]) => `
            <div class="flex justify-between items-center bg-slate-100 dark:bg-slate-800 p-3 rounded-lg">
                <span class="font-semibold text-sm truncate w-2/3">${name}</span>
                <span class="bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-200 px-2 py-1 rounded text-xs font-bold">${val} pzs</span>
            </div>
        `).join('');

        // UI Tabla Estados
        const listaEst = Object.entries(estAg).map(([k,v]) => {
            const [es, pr] = k.split('|');
            return { es, pr, v };
        }).sort((a,b) => b.v - a.v).slice(0, 15);

        document.getElementById('tablaS4Der').innerHTML = listaEst.map(r => `
            <tr class="border-b border-slate-100 dark:border-slate-800">
                <td class="py-3 px-2 font-medium">${r.es}</td>
                <td class="py-3 px-2 text-slate-500">${r.pr}</td>
                <td class="py-3 px-2 text-right font-bold">${r.v}</td>
            </tr>
        `).join('');
        
        if (listaEst.length > 0) document.getElementById('topDestino').innerText = listaEst[0].es;
    }

    // Carga inicial
    descargarDatos();
</script>
</body>
</html>
