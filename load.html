<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Archivos - Operaciones</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        h1 { color: #2c3e50; margin-top: 0; text-align: center; }
        .header-links { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9em; }
        .header-links a { color: #3498db; text-decoration: none; font-weight: bold; }
        .header-links a:hover { text-decoration: underline; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1em; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; background-color: #27ae60; color: white; transition: background 0.3s; }
        .btn:hover { background-color: #219150; }
        .btn:disabled { background-color: #95a5a6; cursor: not-allowed; }

        #statusBox { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; font-weight: bold; text-align: center; }
        .status-info { background-color: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }
        .status-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .status-error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <a href="index.html">← Regresar al Dashboard</a>
        <a href="#" onclick="cerrarSesion()">Cerrar Sesión</a>
    </div>

    <h1>Cargar Envíos</h1>

    <div class="form-group">
        <label for="paqueteria">Selecciona la Paquetería:</label>
        <select id="paqueteria">
            <option value="FedEx">FedEx</option>
            <option value="Afimex">Afimex</option>
            <option value="Local">Entrega Local</option>
        </select>
    </div>

    <div class="form-group">
        <label for="csvFile">Sube el archivo (.csv):</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <button id="btnSubir" class="btn" onclick="procesarArchivo()">Subir Información a Base de Datos</button>

    <div id="statusBox"></div>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE
    // ==========================================
    const SUPABASE_URL = 'TU_PROJECT_URL_AQUI'; 
    const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI'; 
    const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function verificarAcceso() {
        const { data: { session }, error } = await clienteSupabase.auth.getSession();
        if (!session || error) window.location.href = "login.html";
    }
    verificarAcceso();

    async function cerrarSesion() {
        await clienteSupabase.auth.signOut();
        window.location.href = "login.html";
    }

    function mostrarMensaje(texto, tipo) {
        const box = document.getElementById('statusBox');
        box.innerText = texto;
        box.className = 'status-' + tipo;
        box.style.display = 'block';
    }

    // ==========================================
    // DICCIONARIO DE ESTADOS DE MÉXICO
    // ==========================================
    const diccionarioEstados = {
        "AG": "Aguascalientes", "BC": "Baja California", "BS": "Baja California Sur",
        "CA": "Campeche", "CS": "Chiapas", "CH": "Chihuahua", "CM": "Ciudad de México", 
        "CX": "Ciudad de México", "DF": "Ciudad de México", "CO": "Coahuila", "CL": "Colima", 
        "DG": "Durango", "EM": "Estado de México", "ME": "Estado de México", "GT": "Guanajuato", 
        "GR": "Guerrero", "HG": "Hidalgo", "JA": "Jalisco", "MI": "Michoacán", "MO": "Morelos", 
        "NA": "Nayarit", "NL": "Nuevo León", "OA": "Oaxaca", "PU": "Puebla", "QT": "Querétaro", 
        "QR": "Quintana Roo", "SL": "San Luis Potosí", "SI": "Sinaloa", "SO": "Sonora", 
        "TB": "Tabasco", "TM": "Tamaulipas", "TL": "Tlaxcala", "VE": "Veracruz", 
        "YU": "Yucatán", "ZA": "Zacatecas"
    };

    // ==========================================
    // EL "TRADUCTOR" DE FECHAS MEJORADO
    // ==========================================
    function formatoFechaDB(fechaTexto) {
        if (!fechaTexto) return null;
        fechaTexto = fechaTexto.trim().replace('T', ' ');

        // Si ya viene en formato de Base de Datos (YYYY-MM-DD...)
        if (fechaTexto.match(/^\d{4}-\d{2}-\d{2}/)) {
            return fechaTexto; 
        }
        
        // Si viene en formato Excel mexicano (DD/MM/YYYY...)
        const partes = fechaTexto.split(/[\s/:-]+/); 
        if (partes.length >= 3) {
            let dia = partes[0];
            let mes = partes[1];
            let anio = partes[2];
            
            // Si por alguna razón el año viene al principio
            if (anio.length !== 4 && dia.length === 4) {
                anio = partes[0];
                dia = partes[2];
            }
            
            let hora = partes[3] || '00';
            let minuto = partes[4] || '00';
            let segundo = partes[5] || '00';

            return `${anio}-${mes}-${dia}T${hora}:${minuto}:${segundo}`;
        }
        return null;
    }

    // ==========================================
    // PROCESAMIENTO DEL ARCHIVO 
    // ==========================================
    async function procesarArchivo() {
        const fileInput = document.getElementById('csvFile');
        const paqueteriaSeleccionada = document.getElementById('paqueteria').value;
        const btn = document.getElementById('btnSubir');

        if (!fileInput.files.length) {
            mostrarMensaje("Por favor, selecciona un archivo CSV primero.", "error");
            return;
        }

        const seguro = confirm(`¿Estás seguro que deseas cargar la información de ${paqueteriaSeleccionada}? \n\nRevisa que el archivo corresponda a esta paquetería.`);
        if (!seguro) return; 

        btn.disabled = true;
        mostrarMensaje("Leyendo archivo...", "info");

        Papa.parse(fileInput.files[0], {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const filas = results.data;
                
                const datosLimpios = filas.map(fila => {
                    let dataMapeada = {
                        tracking_number: fila.tracking_number ? String(fila.tracking_number) : 'Sin Tracking',
                        paqueteria: paqueteriaSeleccionada,
                        detalles_extra: fila 
                    };

                    if (paqueteriaSeleccionada === 'FedEx') {
                        dataMapeada.fecha_envio = formatoFechaDB(fila.created_at);
                        dataMapeada.fecha_entrega = formatoFechaDB(fila.delivered_at);
                        dataMapeada.destinatario = fila.consignee_name;
                        dataMapeada.ciudad = fila.consignee_city;
                        
                        // Traductor inteligente de Estados
                        let estadoAbrev = fila.consignee_state ? fila.consignee_state.trim().toUpperCase() : '';
                        dataMapeada.estado_destino = diccionarioEstados[estadoAbrev] || estadoAbrev; // Si no lo reconoce, deja el original
                        
                        dataMapeada.estatus_entrega = fila.status;
                        dataMapeada.monto_cobrado = Number(fila.cash_on_delivery_amount) || 0;
                        dataMapeada.producto = fila.products || fila.name || 'No especificado';
                    }
                    return dataMapeada;
                });

                const tamañoLote = 500; 
                let errores = 0;

                mostrarMensaje(`Actualizando ${datosLimpios.length} registros en lotes de ${tamañoLote}...`, "info");

                for (let i = 0; i < datosLimpios.length; i += tamañoLote) {
                    const lote = datosLimpios.slice(i, i + tamañoLote);
                    
                    const { error } = await clienteSupabase
                        .from('paquetes_enviados')
                        .upsert(lote, { onConflict: 'tracking_number' });

                    if (error) {
                        console.error("Error en el lote", i, error);
                        errores++;
                    }
                }

                if (errores > 0) {
                    mostrarMensaje(`Proceso terminado con ${errores} error(es). Revisa la consola.`, "error");
                } else {
                    mostrarMensaje(`¡Éxito! Se actualizaron ${filas.length} paquetes correctamente.`, "success");
                    fileInput.value = ""; 
                }
                btn.disabled = false;
            },
            error: function(err) {
                mostrarMensaje("Error leyendo el CSV: " + err.message, "error");
                btn.disabled = false;
            }
        });
    }
</script>


</body>
</html>
